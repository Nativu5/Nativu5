name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.4

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=6"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.4

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=stats-organization&repo=github-readme-stats"
          path: profile/pin-readme-tools-github-readme-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.4

      - name: Validate generated cards
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          cards=(profile/*.svg)

          if (( ${#cards[@]} == 0 )); then
            echo "::error::No SVG cards were generated"
            exit 1
          fi

          for card in "${cards[@]}"; do
            if ! grep -q "<svg" "$card"; then
              echo "::error file=$card::Generated file is not an SVG"
              exit 1
            fi

            if grep -Eiq \
              "Something went wrong|Resource not accessible|Repository Not found|Application Error" \
              "$card"; then
              echo "::error file=$card::Generated SVG contains an error card"
              exit 1
            fi
          done

      - name: Commit cards
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "README cards are already up to date."
          else
            git commit -m "Update README cards"
            git push
          fi
